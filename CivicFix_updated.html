<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>CivicFix: Report. Track. Resolve.</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
<style>
:root{--bg:#070b1f;--p:#8b5cf6;--b:#22d3ee;--t:#eef0ff;--m:#9aa3c7;--ok:#34d399;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--t);font:15px/1.45 "Space Grotesk",system-ui,sans-serif;min-height:100vh;background:radial-gradient(1000px 520px at 85% -10%,#34127f 0,transparent 60%),radial-gradient(800px 480px at -10% 105%,#0a3b6e 0,transparent 55%),var(--bg)}
h1,h2,h3{margin:0;line-height:1.15}.mu{color:var(--m);font-size:.85rem}
.g{background:rgba(10,14,38,.5);backdrop-filter:blur(5px);border:1px solid rgba(139,92,246,.35);border-radius:18px;padding:16px;box-shadow:0 0 24px rgba(139,92,246,.12)}
.btn{border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:700;color:#fff;background:linear-gradient(135deg,#7c3aed,#a855f7 60%,#22d3ee);box-shadow:0 0 18px rgba(139,92,246,.55);cursor:pointer}
.btn.o{background:transparent;border:1px solid var(--p);box-shadow:none}.btn.sm{padding:7px 12px;font-size:.82rem}.btn.w{width:100%}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--b);outline-offset:2px}
input,select,textarea{width:100%;font:inherit;color:var(--t);background:rgba(7,11,31,.7);border:1px solid rgba(139,92,246,.4);border-radius:12px;padding:11px;margin:4px 0 10px}
label{font-weight:500;font-size:.85rem;color:var(--m)}
.app{display:flex}.side{width:226px;padding:16px;position:sticky;top:0;height:100vh;border-right:1px solid rgba(139,92,246,.25);display:flex;flex-direction:column;gap:4px;background:rgba(7,11,31,.42);backdrop-filter:blur(5px)}.side.c{width:70px}.side.c span{display:none}
.side button.n{display:flex;gap:10px;align-items:center;background:none;border:0;color:var(--m);font:inherit;padding:11px;border-radius:12px;cursor:pointer;text-align:left}
.side button.n.on{background:linear-gradient(135deg,rgba(124,58,237,.5),rgba(34,211,238,.2));color:#fff;box-shadow:0 0 14px rgba(139,92,246,.4)}
.main{flex:1;min-width:0;padding:20px;max-width:1120px;margin:0 auto;padding-bottom:100px}
.bn{display:none;position:fixed;left:0;right:0;bottom:0;background:rgba(10,14,38,.8);backdrop-filter:blur(6px);border-top:1px solid rgba(139,92,246,.4);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
.bn button{flex:1;background:none;border:0;color:var(--m);font:inherit;font-size:.72rem;padding:6px;cursor:pointer;position:relative}.bn button.on{color:#fff}.bn .rp{margin-top:-22px}.bn .rp b{display:block;width:50px;height:50px;border-radius:50%;margin:0 auto 2px;background:linear-gradient(135deg,#7c3aed,#22d3ee);box-shadow:0 0 20px #8b5cf6;font-size:1.5rem;line-height:50px}
@media(max-width:860px){.side{display:none}.bn{display:flex}.main{padding:14px 14px 100px}}
.grid{display:grid;gap:12px}.c2{grid-template-columns:repeat(2,1fr)}.c3{grid-template-columns:repeat(3,1fr)}.c4{grid-template-columns:repeat(4,1fr)}
@media(max-width:640px){.c4{grid-template-columns:repeat(2,1fr)}.c3.k{grid-template-columns:repeat(2,1fr)}}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tile{text-align:left;color:var(--t);font:inherit;cursor:pointer}.tile .ic{font-size:1.6rem;width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:rgba(139,92,246,.22);box-shadow:0 0 14px rgba(139,92,246,.4);margin-bottom:8px}
.tile.sel{border-color:var(--b);box-shadow:0 0 22px rgba(34,211,238,.45)}
.hero{background:linear-gradient(135deg,rgba(124,58,237,.55),rgba(34,211,238,.18));padding:22px}
.big{font-size:1.9rem;font-weight:700}.lg{font-family:inherit;font-size:clamp(2rem,6vw,3.6rem);font-weight:700;letter-spacing:-.02em;background:linear-gradient(90deg,#fff,#c4b5fd 50%,#67e8f9);-webkit-background-clip:text;background-clip:text;color:transparent}
.pl{font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:99px;border:1px solid var(--c);color:var(--c)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.chip{font:inherit;color:var(--t);background:rgba(255,255,255,.06);border:1px solid rgba(139,92,246,.4);border-radius:99px;padding:7px 13px;cursor:pointer}.chip.on{background:linear-gradient(135deg,#7c3aed,#22d3ee);border-color:transparent}
.tl{margin:10px 0}.ti{display:flex;gap:12px;padding-bottom:14px;position:relative;opacity:.5}.ti i{width:16px;height:16px;border-radius:50%;background:#2a2f6b;flex:none;margin-top:3px;z-index:1}.ti:not(:last-child)::before{content:"";position:absolute;left:7px;top:18px;bottom:0;width:2px;background:#2a2f6b}.ti.on{opacity:1}.ti.on i{background:var(--ok);box-shadow:0 0 10px var(--ok)}.ti.cur i{background:var(--b);box-shadow:0 0 14px var(--b)}
.bar{height:9px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#7c3aed,#22d3ee)}
.map{width:100%;height:auto;border-radius:16px;border:1px solid rgba(139,92,246,.4)}.th{width:100%;max-height:200px;object-fit:cover;border-radius:12px;margin:8px 0}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:9px 8px;border-bottom:1px solid rgba(139,92,246,.2);text-align:left;font-size:.85rem}td select{margin:0;padding:6px}
.ok{width:84px;height:84px;border-radius:50%;margin:10px auto;background:radial-gradient(circle,#34d399,#059669);display:flex;align-items:center;justify-content:center;font-size:2.6rem;animation:pop .6s ease-out;box-shadow:0 0 40px #34d399}@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.fade{animation:fd .5s ease-out both}@keyframes fd{from{opacity:0;transform:translateY(14px)}}
.dot{position:absolute;top:2px;right:18%;background:#ef4444;color:#fff;border-radius:9px;font-size:.65rem;padding:0 5px}
.land{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:14px}
.bgs{position:fixed;inset:0;z-index:-2}.bgs div{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;animation:cfbg 27s infinite}.bgs div:nth-child(2){animation-delay:9s}.bgs div:nth-child(3){animation-delay:18s}@keyframes cfbg{0%{opacity:0}6%{opacity:1}33%{opacity:1}40%{opacity:0}100%{opacity:0}}
.ov{position:fixed;inset:0;z-index:-1;background:linear-gradient(135deg,rgba(52,18,127,.18),rgba(7,11,31,.34));transition:background .4s}body.lp .ov{background:linear-gradient(180deg,rgba(7,11,31,.08),rgba(7,11,31,.45))}.land{text-shadow:0 2px 14px rgba(0,0,0,.65)}
h2,h3,.mu{text-shadow:0 1px 8px rgba(0,0,0,.55)}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin:10px 0 22px}.fg .g h3{font-size:1rem;margin-bottom:6px}.fg .g p{margin:0;color:var(--t);font-size:.9rem}.fg .no{color:var(--b);font-weight:700;font-size:.8rem;margin-bottom:4px}.fg .pl{--c:#22d3ee;display:inline-block;margin-top:8px}.st{width:100%;border-collapse:collapse}.st td,.st th{text-align:left;padding:9px 10px;border-bottom:1px solid rgba(139,92,246,.3);vertical-align:top;font-size:.9rem}.st th{color:var(--b)}.plan ol,.plan ul{margin:6px 0 0;padding-left:20px}.plan li{margin:3px 0}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#1b1450;border:1px solid var(--p);padding:10px 16px;border-radius:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}#toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.bgs div:first-child{opacity:1!important}}
</style></head><body><div id="app"></div><div id="toast" role="status"></div>

return `<div class="grid c2" style="align-items:start"><div class="g"><div class="row" style="justify-content:flex-start"><div style="width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#22d3ee);display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:700">${esc(u.name[0].toUpperCase())}</div><div><h2>${esc(u.name)}</h2><div class="mu">${esc(u.email)}<br>${esc(u.mobile)}</div></div></div><div class="row" style="margin:12px 0"><span>Complaints <b>${m.length}</b></span><span>Resolved <b>${m.filter(r=>r.st===4).length}</b></span></div><label>Full name</label><input id="pn" value="${esc(u.name)}"><label>Age</label><input id="pa" value="${u.age}"><label>Mobile</label><input id="pm" value="${esc(u.mobile)}"><button class="btn w" onclick="saveProfile()">Save changes</button></div><div>${M.map(x=>`<button class="g tile" style="width:100%;margin-bottom:8px" onclick="${x[0].startsWith('info')?`INFO='${x[0].slice(5)}';go('info')`:`go('${x[0]}')`}">${x[1]} →</button>`).join('')}<button class="g tile" style="width:100%;color:#fca5a5" onclick="logout()">Log Out</button></div></div>`}
function info(){const i=INF[INFO];return `<div class="g"><h2>${i[0]}</h2><p>${i[1]}</p><button class="btn o" onclick="go('profile')">← Back</button></div>`}
function acc(){const a=DB.rs,o=a.filter(r=>r.st<4),od=o.filter(r=>Date.now()-r.t>7*D),rs=a.filter(r=>r.st===4),av=rs.length?(rs.reduce((s,r)=>s+(r.log[r.log.length-1][1]-r.t),0)/rs.length/D).toFixed(1):'0';
return `<h2>Accountability & Transparency</h2><div class="grid c4 k">${[['Total reported',a.length],['Resolved',rs.length],['Awaiting action',o.length],['Overdue (7+ days)',od.length]].map(x=>`<div class="g"><div class="mu">${x[0]}</div><div class="big">${x[1]}</div></div>`).join('')}</div><div class="grid c2" style="margin-top:12px"><div class="g"><h3>Pending by department</h3>${bars(DEPT.map(d=>[d,o.filter(r=>(r.dept||CATS[r.cat][2])===d).length,Math.max(1,o.length)]))}<div class="mu">Average resolution time: <b style="color:#fff">${av} days</b> · Resolution rate ${Math.round(rs.length/a.length*100)}%</div></div><div class="g"><h3>Public complaint status</h3><div class="mu">No names or contact details shown.</div>${a.slice(0,8).map(r=>`<div class="row" style="margin:8px 0"><span>${r.id} · ${CATS[r.cat][0]}</span>${pill(r)}</div>`).join('')}</div></div><p class="mu">Disclaimer: proposed demonstration platform, not an officially connected government system.</p>`}
function admin(){const a=DB.rs,q=AQ.toLowerCase(),l=a.filter(r=>(AF==='all'||String(r.st)===AF)&&(r.id+CATS[r.cat][0]+r.addr).toLowerCase().includes(q)),s=a.find(r=>r.id===AS);
return `<div class="main"><div class="row"><div>${logo}</div><h2>Authority Dashboard</h2><button class="btn sm o" onclick="logout()">Log out</button></div><div class="grid c4 k" style="margin:14px 0">${[['Total',a.length],['Pending',a.filter(r=>r.st<2).length],['Critical',a.filter(r=>r.sev==='Critical'&&r.st<4).length],['Resolved',a.filter(r=>r.st===4).length]].map(x=>`<div class="g"><div class="mu">${x[0]}</div><div class="big">${x[1]}</div></div>`).join('')}</div><div class="grid c2"><div class="g"><h3>By department</h3>${bars(DEPT.map(d=>[d,a.filter(r=>(r.dept||CATS[r.cat][2])===d&&r.st<4).length,Math.max(1,a.length)]))}</div><div class="g"><h3>By status</h3>${bars(ST.map((x,i)=>[x,a.filter(r=>r.st===i).length,Math.max(1,a.length)]))}</div></div><div class="g" style="margin-top:12px"><div class="row"><h3>Complaints</h3><div class="row"><input style="width:200px;margin:0" placeholder="Search" value="${esc(AQ)}" oninput="AQ=this.value;clearTimeout(window.aq);window.aq=setTimeout(render,250)"><select style="width:auto;margin:0" onchange="AF=this.value;render()"><option value="all">All status</option>${ST.map((x,i)=>`<option value="${i}" ${AF==i?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="sc"><table><tr><th>ID</th><th>Issue</th><th>Location</th><th>Severity</th><th>Department</th><th>Status</th><th></th></tr>${l.map(r=>`<tr><td>${r.id}</td><td>${CATS[r.cat][1]} ${CATS[r.cat][0]}</td><td>${esc(r.addr)}</td><td style="color:${SC[r.sev]}">${r.sev}</td><td>${esc(r.dept||'Unassigned')}</td><td>${pill(r)}</td><td><button class="btn sm" onclick="AS='${r.id}';render();scrollTo(0,document.body.scrollHeight)">Manage</button></td></tr>`).join('')}</table></div></div>${s?`<div class="g fade" style="margin-top:12px"><h3>Manage ${s.id}</h3>${s.photo?`<img class="th" src="${s.photo}" alt="Photo">`:''}<p>${esc(s.desc)}</p><div class="mu">📍 ${esc(s.addr)}</div><div class="grid c3 k"><div><label>Department</label><select id="ad"><option value="">Unassigned</option>${DEPT.map(d=>`<option ${s.dept===d?'selected':''}>${d}</option>`).join('')}</select></div><div><label>Priority</label><select id="av">${SV.map(v=>`<option ${s.sev===v?'selected':''}>${v}</option>`).join('')}</select></div><div><label>Status</label><select id="as">${ST.map((x,i)=>`<option value="${i}" ${s.st===i?'selected':''}>${x}</option>`).join('')}</select></div></div><label>Progress remarks</label><textarea id="ar" rows="2"></textarea><div class="row"><button class="btn" onclick="adminSave('${s.id}')">Save update</button><button class="btn o" onclick="adminSave('${s.id}',4)">Mark resolved</button></div>${tl(s)}</div>`:''}</div>`}
const NAV=[['home','🏠','Home'],['track','📍','Track'],['report','➕','Report'],['map','🗺️','Map'],['insights','📊','Insights'],['acc','⚖️','Accountability'],['notes','🔔','Alerts'],['plan','🧭','V2 Features'],['profile','👤','Profile']],BN=['home','track','report','notes','profile'];

const FG=[
['Core citizen features',[
['1','AI pothole detection','Automatically identify potholes, cracks and damaged road surfaces from uploaded photographs. Suggest severity for human verification.','High priority'],
['2','Automatic live-location detection','When someone reports a problem, capture GPS coordinates and display the exact location on the city map. Allow manual correction.'],
['3','Live complaint timeline','Show every stage: complaint submitted, authority notified, inspection pending, repair in progress, resolution submitted, citizen verification.'],
['4','Multilingual voice reporting','Citizens can speak in Telugu, Hindi or English instead of typing. Convert their speech into a structured complaint.'],
['5','Duplicate complaint detection','If 20 people report the same pothole, combine them into one main issue with 20 supporting reports instead of creating 20 separate complaints.'],
['6','Emergency hazard alerts','Flag exposed live wires, dangerous open manholes and severe flooding. Direct users to the relevant emergency or utility contact. Never imply that an app notification itself makes the area safe.']]],
['Features that make CivicFix unique',[
['7','Civic Priority Engine','Automatically rank complaints by risk to human life, accident potential, number of people affected, issue severity and how long the issue remains unresolved. Example: an exposed electrical wire near a school should receive more urgent attention than a minor footpath crack.','Standout feature'],
['8','Public Accountability Scoreboard','Display publicly available indicators for each participating department: complaints received, complaints resolved, average resolution time, pending complaints and citizen-confirmed repairs. Only publish verified and fairly comparable department data.'],
['9','Before-and-After Repair Verification','When an authority marks an issue as resolved, upload an after-photo. Citizens can confirm whether the problem is genuinely fixed or report that it remains unresolved.'],
['10','Repeat Problem Detection','Detect locations where the same issue keeps returning. Example: if a road develops potholes repeatedly after rainfall, flag it for a deeper infrastructure inspection rather than another temporary repair.'],
['11','Civic Repair Deadline Monitor','Display the assigned department, expected response date and overdue status. Use configurable targets rather than claiming every complaint has a legally guaranteed deadline.'],
['12','Community Confirmation System','Nearby citizens can confirm that the reported problem exists, that it is still present, or that the repair has been completed. This reduces false reports and improves confidence in the data.']]],
['Smart city and community features',[
['13','City Problem Heatmap','Show areas with the highest concentration of potholes, drainage issues and broken lights.'],
['14','Safe Route Finder','Suggest alternative routes that avoid reported road hazards. Clearly show when information was last updated.'],
['15','Volunteer Network','Connect volunteers with approved community-cleanup activities and civic awareness campaigns.'],
['16','Infrastructure Health Report','Generate monthly reports showing recurring problems, repair progress and infrastructure hotspots.'],
['17','Civic Hero Rewards','Award badges for verified reports, helpful confirmations and community participation. Avoid rewarding complaint quantity alone.'],
['18','Rainfall Risk Alerts','Combine available weather and drainage information to warn citizens about potential waterlogging hotspots.']]]
];
const SECS=[['Home','Personal overview'],['Report Issue','Photo, voice and GPS'],['City Map','Live civic hotspots'],['Track Issues','Complaint timeline'],['AI Assistant','Smart reporting help'],['Accountability','Department performance'],['Community','Citizen participation'],['City Intelligence','Trends and analytics'],['Civic Rewards','Badges and recognition'],['Settings','Profile and languages']];
function plan(){
return `<h2>Civic Fix V2 Features</h2><p class="mu">Our problem. Our city. One solution.</p>`+
FG.map((g,gi)=>`<h3 style="margin:18px 0 0">${gi+1}. ${g[0]}</h3><div class="fg">${g[1].map(f=>`<div class="g"><div class="no">Feature ${f[0]}</div><h3>${esc(f[1])}</h3><p>${esc(f[2])}</p>${f[3]?`<span class="pl">${esc(f[3])}</span>`:''}</div>`).join('')}</div>`).join('')+
`<h3>4. The most powerful feature: Civic Intelligence Dashboard</h3><div class="g plan" style="margin:10px 0 22px"><p style="margin:0 0 8px">The signature feature of CivicFix. Imagine a municipal authority opening one dashboard and seeing:</p><div class="grid c3 k">${[['245','Reported road problems'],['87','Drainage complaints'],['34','Broken streetlights'],['12','Urgent electrical hazards'],['65','Complaints awaiting action'],['108','Citizen-verified resolutions']].map(x=>`<div class="g"><div class="big">${x[0]}</div><div class="mu">${x[1]}</div></div>`).join('')}</div><p class="mu" style="margin:8px 0">These are illustrative numbers, not actual city data.</p><p style="margin:0">The dashboard could also show:</p><ol><li>Which area needs immediate attention?</li><li>Which department has the most overdue complaints?</li><li>Which roads repeatedly develop potholes?</li><li>Which neighborhoods have poor infrastructure?</li><li>Where should the next maintenance budget be prioritised?</li></ol><p style="margin:10px 0 0">This transforms CivicFix from a complaint application into a tool for infrastructure planning.</p></div>`+
`<h3>5. Which features should you actually build?</h3><div class="g plan" style="margin:10px 0 22px"><p style="margin:0 0 8px">Don’t try to implement all 18 features immediately. Build in three stages.</p><table class="st"><tr><th>Stage</th><th>Features</th></tr><tr><td>MVP: first working version</td><td>Reporting, GPS, photo upload, tracking, city map, user login</td></tr><tr><td>Advanced version</td><td>AI detection, duplicate reports, priority engine, multilingual voice, verification</td></tr><tr><td>Future version</td><td>Authority dashboard, predictive maintenance, safe routes, infrastructure analytics</td></tr></table><h3 style="margin:16px 0 4px">Top 5 recommendations</h3><ol><li>AI pothole and infrastructure detection</li><li>Civic Priority Engine</li><li>Public Accountability Scoreboard</li><li>Before-and-After Repair Verification</li><li>Repeat Problem Detection</li></ol><p style="margin:10px 0 0">These five features give CivicFix a stronger identity than an ordinary complaint-reporting app.</p></div>`+
`<h3>6. Suggested final app structure</h3><div class="g plan" style="margin:10px 0 22px"><b>CivicFix Smart City</b><div class="mu">Our problem. Our city. One solution.</div><div class="fg" style="margin:12px 0">${SECS.map(x=>`<div class="g"><b>${x[0]}</b><div class="mu">${x[1]}</div></div>`).join('')}</div><p style="margin:0">Suggested application architecture: 10 main sections.</p><p style="margin:8px 0 0"><b>One important recommendation:</b> keep the citizen app and municipal authority dashboard as two connected interfaces with different permissions. Citizens should not be able to modify official complaint statuses or department performance figures.</p></div>`}

const VIEWS={plan,home,report,track,map:()=>`<h2>City problem map</h2>${mapView()}`,insights,notes,profile,info,acc};
function render(){const a=$('#app');document.body.classList.toggle('lp',['land','auth','admlogin'].includes(V));
if(V==='land')a.innerHTML=land();else if(V==='auth')a.innerHTML=auth();else if(V==='admlogin')a.innerHTML=admLogin();else if(V==='admin'&&DB.adm)a.innerHTML=admin();
else if(!DB.me){V='land';a.innerHTML=land()}else{const n=unread(),act=V==='info'?'profile':V;
a.innerHTML=`<div class="app"><nav class="side ${SB?'c':''}" aria-label="Main">${logo.replace('justify-content:center','justify-content:flex-start')}<button class="n" onclick="SB=!SB;render()" aria-label="Collapse sidebar">☰ <span>Collapse</span></button>${NAV.map(x=>`<button class="n ${act===x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]} <span>${x[2]}${x[0]==='notes'&&n?' ('+n+')':''}</span></button>`).join('')}<button class="n" onclick="logout()" style="margin-top:auto">🚪 <span>Log out</span></button></nav><main class="main fade" id="mv">${VIEWS[V]()}</main></div><nav class="bn" aria-label="Mobile">${BN.map(k=>{const x=NAV.find(y=>y[0]===k);return `<button class="${act===k?'on':''} ${k==='report'?'rp':''}" onclick="go('${k}')">${k==='report'?'<b>+</b>':x[1]+'<br>'}${x[2]}${k==='notes'&&n?`<span class="dot">${n}</span>`:''}</button>`}).join('')}</nav>`}}
document.body.insertAdjacentHTML('afterbegin','<div class="bgs" aria-hidden="true">'+BGI.map(u=>`<div style="background-image:url(${u})"></div>`).join('')+'</div><div class="ov"></div>');
render();
</script></body></html>
